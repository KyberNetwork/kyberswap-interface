definitions:
  TransactionPreparationServicePrepareAddCapitalBody:
    type: object
    properties:
      amountRaw:
        type: string
  TransactionPreparationServicePrepareClosePositionBody:
    type: object
    properties:
      slippageBps:
        type: integer
        format: int64
  TransactionPreparationServicePrepareManualSellBody:
    type: object
    properties:
      slippageBps:
        type: integer
        format: int64
      expectedUnresolvedSkipCount:
        type: integer
        format: int64
      expectedSellRatioRaw:
        type: string
  TransactionPreparationServicePrepareStartCopyBody:
    type: object
    properties:
      chainId:
        type: string
        format: int64
      targetCapitalRaw:
        type: string
      startRequestId:
        type: string
      fundingMode:
        $ref: '#/definitions/v1StartCopyFundingMode'
      createPermitData:
        type: string
        format: byte
        description: |-
          Optional opaque permit transport for FUNDED mode. Token-specific format
          and capability checks remain operator-owned.
  TransactionPreparationServicePrepareStopCopyBody:
    type: object
    properties:
      userPositionIds:
        type: array
        items:
          type: string
      slippageBps:
        type: integer
        format: int64
  TransactionPreparationServicePrepareWithdrawQuoteBody:
    type: object
    properties:
      amountRaw:
        type: string
        description: |-
          Canonical positive uint256. Values below uint256.max withdraw that exact
          amount; uint256.max withdraws the full quote balance at execution.
    required:
      - amountRaw
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1ActionBlock:
    type: object
    properties:
      blockNumber:
        type: string
      blockHash:
        type: string
      blockTime:
        type: string
        format: date-time
    description: ActionBlock is the fresh canonical mutable-state and preflight block H.
  v1ActionDisplayEnrichment:
    type: object
    properties:
      status:
        $ref: '#/definitions/v1ActionDisplayEnrichmentStatus'
      unavailableReason:
        $ref: '#/definitions/v1ActionDisplayEnrichmentUnavailableReason'
    description: ActionDisplayEnrichment reports the atomic render-only enrichment outcome.
  v1ActionDisplayEnrichmentStatus:
    type: string
    enum:
      - ACTION_DISPLAY_ENRICHMENT_STATUS_UNSPECIFIED
      - ACTION_DISPLAY_ENRICHMENT_STATUS_NOT_APPLICABLE
      - ACTION_DISPLAY_ENRICHMENT_STATUS_COMPLETE
      - ACTION_DISPLAY_ENRICHMENT_STATUS_UNAVAILABLE
    default: ACTION_DISPLAY_ENRICHMENT_STATUS_UNSPECIFIED
    description: |-
      ActionDisplayEnrichmentStatus describes only aggregate-owned, render-only
      preview enrichment. It does not change action readiness or calldata validity.
  v1ActionDisplayEnrichmentUnavailableReason:
    type: string
    enum:
      - ACTION_DISPLAY_ENRICHMENT_UNAVAILABLE_REASON_UNSPECIFIED
      - ACTION_DISPLAY_ENRICHMENT_UNAVAILABLE_REASON_SOURCE_UNAVAILABLE
      - ACTION_DISPLAY_ENRICHMENT_UNAVAILABLE_REASON_BUDGET_EXHAUSTED
    default: ACTION_DISPLAY_ENRICHMENT_UNAVAILABLE_REASON_UNSPECIFIED
    description: |-
      ActionDisplayEnrichmentUnavailableReason is the bounded safe reason exposed
      when render-only preview enrichment could not be completed.
  v1ActionEvidence:
    type: object
    properties:
      evidenceAnchor:
        $ref: '#/definitions/v1EvidenceAnchor'
      actionBlock:
        $ref: '#/definitions/v1ActionBlock'
    description: |-
      ActionEvidence exposes the fact and mutable-state boundaries used to prepare
      the call. Operator-owned route clocks remain internal; reprepare_after is the
      only client expiry boundary.
  v1ActivityCategory:
    type: string
    enum:
      - ACTIVITY_CATEGORY_UNSPECIFIED
      - ACTIVITY_CATEGORY_TRADE
      - ACTIVITY_CATEGORY_CAPITAL
      - ACTIVITY_CATEGORY_FAILED_ACTION
      - ACTIVITY_CATEGORY_FEE_REBATE
    default: ACTIVITY_CATEGORY_UNSPECIFIED
    description: |-
      ActivityCategory is the stable grouped vocabulary for copy-run logs and
      owner alert feed rows.
  v1ActivityGroup:
