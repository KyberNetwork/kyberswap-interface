  v1Window:
    type: string
    enum:
      - WINDOW_UNSPECIFIED
      - WINDOW_7D
      - WINDOW_30D
      - WINDOW_90D
      - WINDOW_ALL
    default: WINDOW_UNSPECIFIED
    description: Window selects a public metric or chart time window.
  v1WindowPolicy:
    type: string
    enum:
      - WINDOW_POLICY_UNSPECIFIED
      - WINDOW_POLICY_TRAILING
      - WINDOW_POLICY_SINCE_LIVE
      - WINDOW_POLICY_SINCE_COPY_START
    default: WINDOW_POLICY_UNSPECIFIED
    description: WindowPolicy identifies how an APR interval boundary was selected.
  v1WithdrawQuotePreview:
    type: object
    properties:
      quoteToken:
        $ref: '#/definitions/v1Token'
      quoteBalance:
        $ref: '#/definitions/v1RawAmountMetric'
      sweepAmountRaw:
        type: string
      recipientAddress:
        type: string
    description: WithdrawQuotePreview describes a repeatable max sweep to the owner snapshot at H.
