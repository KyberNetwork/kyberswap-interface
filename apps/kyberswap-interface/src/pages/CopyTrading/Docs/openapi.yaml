      - CAPITAL_IN_PROJECTION_STATUS_READY
      - CAPITAL_IN_PROJECTION_STATUS_UNAVAILABLE
    default: CAPITAL_IN_PROJECTION_STATUS_UNSPECIFIED
    description: |-
      CapitalInProjectionStatus describes whether the immutable Capital In
      projection for a copy run is still catching up or is safe to render.

       - CAPITAL_IN_PROJECTION_STATUS_SYNCING: A canonical funding fact is visible, but immutable account-capital
      coverage or the latest monetary recomputation has not completed yet.
       - CAPITAL_IN_PROJECTION_STATUS_READY: The latest monetary work generation completed against proven immutable
      account-capital coverage. capital_in_usd may legitimately be zero.
       - CAPITAL_IN_PROJECTION_STATUS_UNAVAILABLE: Required source lineage or projection authority is unavailable.
