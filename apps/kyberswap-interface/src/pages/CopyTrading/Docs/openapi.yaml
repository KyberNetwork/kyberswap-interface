  v1WithdrawQuotePreview:
    type: object
    properties:
      quoteToken:
        $ref: '#/definitions/v1Token'
      quoteBalance:
        $ref: '#/definitions/v1RawAmountMetric'
      sweepAmountRaw:
        type: string
      recipientAddress:
        type: string
    description: |-
      WithdrawQuotePreview describes the exact requested withdrawal to the owner
      snapshot at H. sweep_amount_raw is the calldata amount and equals the request
      for READY results; uint256.max means the full balance available at execution.
