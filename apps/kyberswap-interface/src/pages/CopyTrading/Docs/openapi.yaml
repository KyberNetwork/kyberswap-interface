      immutable Stop intent. Completed and skipped children are both terminal.
      grpc-gateway omits zero-valued scalar counts from JSON; clients must treat an
      absent count member in a present stop_copy_progress object as zero.
  v1StopPositionPreview:
    type: object
    properties:
      userPositionId:
        type: string
      tradeId:
        type: string
      baseToken:
        $ref: '#/definitions/v1Token'
      userBaseRaw:
        type: string
      cashback:
        $ref: '#/definitions/v1RawAmountMetric'
      currentValuation:
        $ref: '#/definitions/v1PositionValuation'
      lifecycle:
        $ref: '#/definitions/v1PositionLifecycle'
      unrealizedPnlUsd:
        $ref: '#/definitions/v1DecimalMetric'
      swapQuote:
        $ref: '#/definitions/v1SwapQuotePreview'
    description: StopPositionPreview is one bounded position row in a Stop Copy preview.
  v1StrategyCategory:
    type: string
    enum:
      - STRATEGY_CATEGORY_UNSPECIFIED
      - STRATEGY_CATEGORY_FOCUSED
      - STRATEGY_CATEGORY_DIVERSIFIED
      - STRATEGY_CATEGORY_ACTIVE
    default: STRATEGY_CATEGORY_UNSPECIFIED
