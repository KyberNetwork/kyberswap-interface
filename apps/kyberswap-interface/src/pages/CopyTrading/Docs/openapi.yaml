        type: string
        format: int64
      address:
        type: string
      symbol:
        type: string
      name:
        type: string
      decimals:
        type: integer
        format: int32
      logoUrl:
        type: string
    description: Token describes public token display metadata.
  v1TradeSide:
    type: string
    enum:
      - TRADE_SIDE_UNSPECIFIED
      - TRADE_SIDE_BUY
      - TRADE_SIDE_SELL
    default: TRADE_SIDE_UNSPECIFIED
    description: |-
      TradeSide identifies an immutable trade direction in structured activity
      and alert-feed contexts.
  v1WalletBalanceRow:
    type: object
    properties:
      chainId:
        type: string
        format: int64
      copyAccount:
        type: string
      tokenAddress:
        type: string
      amountDecimal:
        type: string
      balanceSource:
        type: string
      freshnessStatus:
        type: string
      balanceAsOfBlock:
        type: string
      cachedAt:
        type: string
        format: date-time
      stalenessReason:
        type: string
      token:
        $ref: '#/definitions/v1Token'
      currentValuation:
        $ref: '#/definitions/v1PositionValuation'
