swagger: "2.0"
info:
  title: AI Copy Trade Aggregate API
  description: UI-facing read API for AI copy trading
  version: 1.0.0
tags:
  - name: Chains
    description: Public chain metadata.
  - name: Leaderboard
    description: Public agent ranking and leaderboard summary reads.
  - name: Agents
    description: Public agent discovery, profile, and position reads.
  - name: Owner Copies
    description: Copy-run, position, activity, and copy-account reads filtered by the initial follower-account creation wallet; this is not current ownership or authorization evidence.
  - name: Copy Accounts
    description: Chain-scoped copy account balances, positions, history, and summary reads.
  - name: Transaction Preparation
    description: Prepare authoritative Copy Trade contract calls for wallet-owned execution.
basePath: /api/v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /chains:
    get:
      summary: ListChains lists enabled public chain metadata.
      operationId: listChains
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListChainsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - Chains
  /leaderboard/summary:
    get:
      summary: GetLeaderboardSummary returns summary cards for the filtered leaderboard universe.
      operationId: getLeaderboardSummary
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetLeaderboardSummaryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: chainId
          in: query
          required: false
          type: string
          format: int64
        - name: search
          in: query
          required: false
          type: string
        - name: strategyCategory
          in: query
          required: false
          type: string
          enum:
            - STRATEGY_CATEGORY_UNSPECIFIED
            - STRATEGY_CATEGORY_FOCUSED
            - STRATEGY_CATEGORY_DIVERSIFIED
            - STRATEGY_CATEGORY_ACTIVE
          default: STRATEGY_CATEGORY_UNSPECIFIED
      tags:
        - Leaderboard
  /leaderboard:
    get:
      summary: ListLeaderboard returns leaderboard agent rows.
      operationId: listLeaderboard
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListLeaderboardResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: chainId
          in: query
          required: false
          type: string
          format: int64
        - name: search
          in: query
          required: false
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: strategyCategory
          in: query
          required: false
          type: string
          enum:
            - STRATEGY_CATEGORY_UNSPECIFIED
            - STRATEGY_CATEGORY_FOCUSED
            - STRATEGY_CATEGORY_DIVERSIFIED
            - STRATEGY_CATEGORY_ACTIVE
          default: STRATEGY_CATEGORY_UNSPECIFIED
        - name: sortBy
          in: query
          required: false
          type: string
          enum:
            - LEADERBOARD_SORT_FIELD_UNSPECIFIED
            - LEADERBOARD_SORT_FIELD_APR_30D
            - LEADERBOARD_SORT_FIELD_WIN_RATE
            - LEADERBOARD_SORT_FIELD_LIFETIME_VOLUME
            - LEADERBOARD_SORT_FIELD_COPIERS
            - LEADERBOARD_SORT_FIELD_AUM
            - LEADERBOARD_SORT_FIELD_OPEN_POSITIONS
          default: LEADERBOARD_SORT_FIELD_UNSPECIFIED
        - name: sortOrder
          in: query
          required: false
          type: string
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_ASC
            - SORT_ORDER_DESC
          default: SORT_ORDER_UNSPECIFIED
      tags:
        - Leaderboard
  /agents:
    get:
      summary: ListAgents searches and lists public agents.
      operationId: listAgents
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAgentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: chainId
          in: query
          required: false
          type: string
          format: int64
        - name: search
          in: query
          required: false
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: strategyCategory
          in: query
          required: false
          type: string
          enum:
            - STRATEGY_CATEGORY_UNSPECIFIED
            - STRATEGY_CATEGORY_FOCUSED
            - STRATEGY_CATEGORY_DIVERSIFIED
            - STRATEGY_CATEGORY_ACTIVE
          default: STRATEGY_CATEGORY_UNSPECIFIED
      tags:
        - Agents
  /agents/{agentId}:
    get:
      summary: GetAgent returns one public agent profile.
      operationId: getAgent
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetAgentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
      tags:
        - Agents
  /agents/{agentId}/stats:
    get:
      summary: GetAgentStats returns one agent metric window.
      operationId: getAgentStats
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetAgentStatsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: window
          in: query
          required: false
          type: string
          enum:
            - WINDOW_UNSPECIFIED
            - WINDOW_7D
            - WINDOW_30D
            - WINDOW_90D
            - WINDOW_ALL
          default: WINDOW_UNSPECIFIED
      tags:
        - Agents
  /agents/{agentId}/performance:
    get:
      summary: ListAgentPerformance returns profile chart points.
      operationId: listAgentPerformance
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAgentPerformanceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: series
          description: |2-
             - PERFORMANCE_SERIES_CUMULATIVE_TOTAL_PNL: Cumulative realised plus unrealised PnL. value_usd is window-relative and
            value_pct is the matching non-annualized, cash-flow-neutral TWR value.
          in: query
          required: false
          type: string
          enum:
            - PERFORMANCE_SERIES_UNSPECIFIED
            - PERFORMANCE_SERIES_PORTFOLIO_EQUITY
            - PERFORMANCE_SERIES_CUMULATIVE_REALIZED_PNL
            - PERFORMANCE_SERIES_PERIOD_REALIZED_PNL
            - PERFORMANCE_SERIES_PER_TRADE_REALIZED_PNL
            - PERFORMANCE_SERIES_CUMULATIVE_TOTAL_PNL
          default: PERFORMANCE_SERIES_UNSPECIFIED
        - name: window
          in: query
          required: false
          type: string
          enum:
            - WINDOW_UNSPECIFIED
            - WINDOW_7D
            - WINDOW_30D
            - WINDOW_90D
            - WINDOW_ALL
          default: WINDOW_UNSPECIFIED
        - name: interval
          in: query
          required: false
          type: string
          enum:
            - PERFORMANCE_INTERVAL_UNSPECIFIED
            - PERFORMANCE_INTERVAL_DAY
            - PERFORMANCE_INTERVAL_WEEK
            - PERFORMANCE_INTERVAL_MONTH
          default: PERFORMANCE_INTERVAL_UNSPECIFIED
      tags:
        - Agents
  /agents/{agentId}/action-logs:
    get:
      summary: ListAgentActionLogs returns the sanitized public agent decision timeline.
      operationId: listAgentActionLogs
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAgentActionLogsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: leaderPositionId
          in: query
          required: false
          type: string
        - name: from
          in: query
          required: false
          type: string
          format: date-time
        - name: to
          in: query
          required: false
          type: string
          format: date-time
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: type
          description: |-
            Exact match against AgentActionLog.action. Filtering is applied before
            grouping, so every returned row matches this value.
          in: query
          required: false
          type: string
        - name: groupBy
          description: |-
            Omitted/UNSPECIFIED currently defaults to SESSION_ID. The enum remains
            explicit so future grouping modes can be added without changing the
            response item type again.
          in: query
          required: false
          type: string
          enum:
            - AGENT_ACTION_LOG_GROUP_BY_UNSPECIFIED
            - AGENT_ACTION_LOG_GROUP_BY_SESSION_ID
          default: AGENT_ACTION_LOG_GROUP_BY_UNSPECIFIED
        - name: side
          in: query
          required: false
          type: string
          enum:
            - TRADE_SIDE_UNSPECIFIED
            - TRADE_SIDE_BUY
            - TRADE_SIDE_SELL
          default: TRADE_SIDE_UNSPECIFIED
      tags:
        - Agents
  /agents/{agentId}/positions:
    get:
      summary: ListAgentPositions returns agent position summary rows.
      operationId: listAgentPositions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAgentPositionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: view
          in: query
          required: false
          type: string
          enum:
            - POSITION_VIEW_UNSPECIFIED
            - POSITION_VIEW_ALL
            - POSITION_VIEW_OPEN
            - POSITION_VIEW_CLOSED
            - POSITION_VIEW_LEFTOVER
          default: POSITION_VIEW_UNSPECIFIED
        - name: token
          in: query
          required: false
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: sortBy
          in: query
          required: false
          type: string
          enum:
            - POSITION_SORT_FIELD_UNSPECIFIED
            - POSITION_SORT_FIELD_OPENED_AT
            - POSITION_SORT_FIELD_CLOSED_AT
            - POSITION_SORT_FIELD_VALUE_USD
          default: POSITION_SORT_FIELD_UNSPECIFIED
        - name: sortOrder
          in: query
          required: false
          type: string
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_ASC
            - SORT_ORDER_DESC
          default: SORT_ORDER_UNSPECIFIED
      tags:
        - Agents
  /agents/{agentId}/positions/{positionId}:
    get:
      summary: GetAgentPosition returns one agent position detail.
      operationId: getAgentPosition
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetAgentPositionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: positionId
          in: path
          required: true
          type: string
      tags:
        - Agents
  /agents/{agentId}/positions/{positionId}/events:
    get:
      summary: ListAgentPositionEvents returns lifecycle events for an agent position.
      operationId: listAgentPositionEvents
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAgentPositionEventsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: agentId
          in: path
          required: true
          type: string
        - name: positionId
          in: path
          required: true
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - Agents
  /users/{ownerAddress}/copy-summary:
    get:
      summary: GetOwnerCopySummary returns public My Copies summary values for an owner.
      operationId: getOwnerCopySummary
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetOwnerCopySummaryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: chainId
          in: query
          required: false
          type: string
          format: int64
        - name: view
          in: query
          required: false
          type: string
          enum:
            - OWNER_COPY_VIEW_UNSPECIFIED
            - OWNER_COPY_VIEW_OPEN
            - OWNER_COPY_VIEW_HISTORY
          default: OWNER_COPY_VIEW_UNSPECIFIED
      tags:
        - Owner Copies
  /users/{ownerAddress}/copy-runs:
    get:
      summary: ListOwnerCopyRuns lists copy runs for an owner.
      operationId: listOwnerCopyRuns
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOwnerCopyRunsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: agentId
          in: query
          required: false
          type: string
        - name: chainId
          in: query
          required: false
          type: string
          format: int64
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: view
          in: query
          required: false
          type: string
          enum:
            - OWNER_COPY_VIEW_UNSPECIFIED
            - OWNER_COPY_VIEW_OPEN
            - OWNER_COPY_VIEW_HISTORY
          default: OWNER_COPY_VIEW_UNSPECIFIED
        - name: sortBy
          in: query
          required: false
          type: string
          enum:
            - OWNER_COPY_RUN_SORT_FIELD_UNSPECIFIED
            - OWNER_COPY_RUN_SORT_FIELD_STARTED_AT
            - OWNER_COPY_RUN_SORT_FIELD_STOPPED_AT
            - OWNER_COPY_RUN_SORT_FIELD_AGENT_APR_30D
            - OWNER_COPY_RUN_SORT_FIELD_AGENT_WIN_RATE
            - OWNER_COPY_RUN_SORT_FIELD_AGENT_LIFETIME_VOLUME
            - OWNER_COPY_RUN_SORT_FIELD_CAPITAL_IN
            - OWNER_COPY_RUN_SORT_FIELD_CURRENT_BALANCE
          default: OWNER_COPY_RUN_SORT_FIELD_UNSPECIFIED
        - name: sortOrder
          in: query
          required: false
          type: string
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_ASC
            - SORT_ORDER_DESC
          default: SORT_ORDER_UNSPECIFIED
      tags:
        - Owner Copies
  /users/{ownerAddress}/copy-runs/{copyRunId}:
    get:
      summary: GetOwnerCopyRun returns one owner copy-run detail.
      operationId: getOwnerCopyRun
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetOwnerCopyRunResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: copyRunId
          in: path
          required: true
          type: string
      tags:
        - Owner Copies
  /users/{ownerAddress}/copy-runs/{copyRunId}/cashback-policy:
    get:
      summary: |-
        GetOwnerCopyRunCashbackPolicy returns the effective account-owned
        cashback policy for exactly one persisted owner/copy-run identity.
      operationId: getOwnerCopyRunCashbackPolicy
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetOwnerCopyRunCashbackPolicyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: copyRunId
          in: path
          required: true
          type: string
      tags:
        - Owner Copies
  /users/{ownerAddress}/copy-runs/{copyRunId}/positions:
    get:
      summary: ListOwnerCopyRunPositions lists positions inside one copy run.
      operationId: listOwnerCopyRunPositions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOwnerCopyRunPositionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: copyRunId
          in: path
          required: true
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: view
          in: query
          required: false
          type: string
          enum:
            - POSITION_VIEW_UNSPECIFIED
            - POSITION_VIEW_ALL
            - POSITION_VIEW_OPEN
            - POSITION_VIEW_CLOSED
            - POSITION_VIEW_LEFTOVER
          default: POSITION_VIEW_UNSPECIFIED
        - name: sortBy
          in: query
          required: false
          type: string
          enum:
            - POSITION_SORT_FIELD_UNSPECIFIED
            - POSITION_SORT_FIELD_OPENED_AT
            - POSITION_SORT_FIELD_CLOSED_AT
            - POSITION_SORT_FIELD_VALUE_USD
          default: POSITION_SORT_FIELD_UNSPECIFIED
        - name: sortOrder
          in: query
          required: false
          type: string
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_ASC
            - SORT_ORDER_DESC
          default: SORT_ORDER_UNSPECIFIED
        - name: includeClosedExecutions
          description: Expands the first bounded sell-execution page for CLOSED positions only.
          in: query
          required: false
          type: boolean
        - name: closedExecutionsLimit
          description: |-
            Applies only when include_closed_executions is true. The normalized parent
            limit multiplied by this limit cannot exceed 100 nested executions.
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - Owner Copies
  /users/{ownerAddress}/copy-runs/{copyRunId}/positions/{positionId}/closed-executions:
    get:
      summary: |-
        ListOwnerCopyRunPositionClosedExecutions lists canonical sell executions
        for one copied position. It is an explicit continuation route for the
        bounded Closed tab expansion.
      operationId: listOwnerCopyRunPositionClosedExecutions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOwnerCopyRunPositionClosedExecutionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: copyRunId
          in: path
          required: true
          type: string
        - name: positionId
          in: path
          required: true
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - Owner Copies
  /users/{ownerAddress}/copy-runs/{copyRunId}/performance:
    get:
      summary: ListOwnerCopyRunPerformance returns copy-run chart points.
      operationId: listOwnerCopyRunPerformance
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOwnerCopyRunPerformanceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: copyRunId
          in: path
          required: true
          type: string
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: series
          description: |2-
             - PERFORMANCE_SERIES_CUMULATIVE_TOTAL_PNL: Cumulative realised plus unrealised PnL. value_usd is window-relative and
            value_pct is the matching non-annualized, cash-flow-neutral TWR value.
          in: query
          required: false
          type: string
          enum:
            - PERFORMANCE_SERIES_UNSPECIFIED
            - PERFORMANCE_SERIES_PORTFOLIO_EQUITY
            - PERFORMANCE_SERIES_CUMULATIVE_REALIZED_PNL
            - PERFORMANCE_SERIES_PERIOD_REALIZED_PNL
            - PERFORMANCE_SERIES_PER_TRADE_REALIZED_PNL
            - PERFORMANCE_SERIES_CUMULATIVE_TOTAL_PNL
          default: PERFORMANCE_SERIES_UNSPECIFIED
        - name: window
          in: query
          required: false
          type: string
          enum:
            - WINDOW_UNSPECIFIED
            - WINDOW_7D
            - WINDOW_30D
            - WINDOW_90D
            - WINDOW_ALL
          default: WINDOW_UNSPECIFIED
        - name: interval
          in: query
          required: false
          type: string
          enum:
            - PERFORMANCE_INTERVAL_UNSPECIFIED
            - PERFORMANCE_INTERVAL_DAY
            - PERFORMANCE_INTERVAL_WEEK
            - PERFORMANCE_INTERVAL_MONTH
          default: PERFORMANCE_INTERVAL_UNSPECIFIED
      tags:
        - Owner Copies
  /users/{ownerAddress}/positions:
    get:
      summary: ListOwnerPositions lists flattened owner positions.
      operationId: listOwnerPositions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOwnerPositionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: ownerAddress
          description: Initial follower-account creation wallet filter; not current ownership or authorization evidence.
          in: path
          required: true
          type: string
        - name: agentId
          in: query
          required: false
          type: string
        - name: chainId
          in: query
          required: false
          type: string
          format: int64
        - name: cursor
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: view
          in: query
          required: false
          type: string
          enum:
            - POSITION_VIEW_UNSPECIFIED
            - POSITION_VIEW_ALL
            - POSITION_VIEW_OPEN
            - POSITION_VIEW_CLOSED
            - POSITION_VIEW_LEFTOVER
          default: POSITION_VIEW_UNSPECIFIED
        - name: sortBy
          in: query
          required: false
          type: string
          enum:
            - POSITION_SORT_FIELD_UNSPECIFIED
            - POSITION_SORT_FIELD_OPENED_AT
            - POSITION_SORT_FIELD_CLOSED_AT
            - POSITION_SORT_FIELD_VALUE_USD
          default: POSITION_SORT_FIELD_UNSPECIFIED
        - name: sortOrder
          in: query
          required: false
          type: string
          enum:
            - SORT_ORDER_UNSPECIFIED
            - SORT_ORDER_ASC
            - SORT_ORDER_DESC
