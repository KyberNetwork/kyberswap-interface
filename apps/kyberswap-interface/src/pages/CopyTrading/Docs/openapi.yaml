        $ref: '#/definitions/v1DecimalMetric'
        description: Copy-run-specific win rate over classified closed follower positions.
      copyRunClassifiedClosedPositionCount:
        $ref: '#/definitions/v1CountMetric'
      portfolioPnlUsd:
        $ref: '#/definitions/v1DecimalMetric'
        description: |-
