          includes selected positions whose child action has not been indexed yet.
      currentBalanceUsd:
        $ref: '#/definitions/v1DecimalMetric'
        description: |-
          Current account equity for the selected copy-run row. Historical rows map
          this from the latest exact current stable balance while it satisfies the
          configured freshness policy; open/closing rows map from current portfolio
          value when every component is current.
      totalPnlUsd:
        $ref: '#/definitions/v1DecimalMetric'
        description: |-
          Window-independent total PnL equals realised plus unrealised PnL. Fees and
          rebates are already included in net execution economics.
      totalPnlPct:
        $ref: '#/definitions/v1DecimalMetric'
        description: |-
